parameters:
    db.host: mysql:host=localhost
    db.name: dbname=bd_gsb
    db.user: root
    db.mdp:
    # Dossier de stockage des justificatifs. %kernel.root_dir% vaut app/ :
    # le dossier est donc HORS de web/ et aucun fichier n'est servi
    # directement par le serveur web.
    justificatifs.dossier: "%kernel.root_dir%/justificatifs"
    # 2 Mo. Ne pas dépasser upload_max_filesize de php.ini (2M par défaut),
    # sinon PHP écarte le fichier avant que l'application le voie.
    justificatifs.taille_max: 2097152
    # Dossier de stockage des cartes grises. Séparé de celui des
    # justificatifs : ce ne sont pas les mêmes documents, ils n'ont pas la même
    # durée de vie, et un dossier par usage évite qu'une erreur de nettoyage sur
    # l'un emporte l'autre. Hors de web/, pour la même raison.
    cartesgrises.dossier: "%kernel.root_dir%/cartesgrises"
    # 5 Mo, comme demandé — en mébioctets, soit 5 * 1024 * 1024.
    #
    # ATTENTION, DEUX LIMITES SE SUPERPOSENT. upload_max_filesize de php.ini
    # vaut 2M par défaut : PHP écarte alors le fichier AVANT que l'application
    # le voie, et le visiteur reçoit un message technique en anglais citant une
    # directive de configuration, au lieu du « dépasse la taille maximale
    # autorisée (5 Mo) » de StockageJustificatifs::valider().
    #
    # php.ini doit donc être réglé STRICTEMENT AU-DESSUS de cette valeur, pour
    # que le contrôle qui parle au visiteur soit celui de l'application. 6M est
    # le choix retenu ; régler php.ini à 5M exactement ne suffit pas, les deux
    # seuils seraient confondus et PHP reprendrait la main.
    #   php -d upload_max_filesize=6M -d post_max_size=8M -S ...
    # post_max_size doit rester supérieur à upload_max_filesize.
    cartesgrises.taille_max: 5242880
    # Logo imprimé en tête des fiches PDF. Chemin sur le disque et non URL :
    # dompdf tourne côté serveur, sans accès réseau (isRemoteEnabled à false).
    fiche_pdf.logo: "%kernel.root_dir%/../src/Pg/GsbFraisBundle/Resources/public/images/logo.svg"
services:
    pg_gsb_frais.pdo:
        class: Pg\GsbFraisBundle\services\PdoGsb
        arguments: [%db.host%,%db.name%,%db.user%,%db.mdp%]
    pg_gsb_frais.justificatifs:
        class: Pg\GsbFraisBundle\services\StockageJustificatifs
        arguments: [%justificatifs.dossier%,%justificatifs.taille_max%]
    # Seconde instance de la MÊME classe : le dossier et la taille maximale
    # sont ses deux arguments de construction, et les types acceptés (pdf, jpg,
    # jpeg, png) sont exactement ceux voulus ici. Il n'y avait donc rien à
    # écrire pour stocker les cartes grises — ni classe, ni héritage, ni copie
    # d'une règle de validation. Le nom de la classe dit « justificatifs »
    # parce qu'elle a été écrite pour eux en phase 2 ; elle ne contient en fait
    # aucune logique propre aux frais.
    pg_gsb_frais.cartesgrises:
        class: Pg\GsbFraisBundle\services\StockageJustificatifs
        arguments: [%cartesgrises.dossier%,%cartesgrises.taille_max%]
    pg_gsb_frais.fiche_pdf:
        class: Pg\GsbFraisBundle\services\GenerateurFichePdf
        arguments: ['@pg_gsb_frais.pdo', '@templating', %fiche_pdf.logo%]
    # Contrôle du compte à chaque requête (phase 8). Écouteur et non appel dans
    # chaque contrôleur : le passage devient obligatoire, y compris pour un
    # contrôleur écrit plus tard. Priorité négative pour passer APRÈS le routeur,
    # sans quoi _route ne serait pas encore renseigné et la liste blanche des
    # routes autorisées ne pourrait pas fonctionner.
    pg_gsb_frais.garde_compte:
        class: Pg\GsbFraisBundle\EventListener\GardeCompteListener
        arguments: ['@service_container']
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: -10 }
