pg_gsb_frais_accueil:
    path: /
    defaults:
        _controller: FrameworkBundle:Redirect:redirect
        route: pg_gsb_frais_home
        permanent: false

pg_gsb_frais_home:
    path: /accueil
    defaults: { _controller: PgGsbFraisBundle:Home:index }
pg_gsb_frais_validerconnexion:
    path: /validerconnexion
    defaults: { _controller: PgGsbFraisBundle:Home:validerconnexion }
    methods: [POST]
pg_gsb_frais_deconnexion:
    path: /deconnexion
    defaults: { _controller: PgGsbFraisBundle:Home:deconnexion }
pg_gsb_frais_listefrais:
    path: /listefrais
    defaults: { _controller: PgGsbFraisBundle:ListeFrais:index }
pg_gsb_frais_saisirfrais:
    path: /saisirfrais
    defaults: { _controller: PgGsbFraisBundle:SaisirFrais:index }
pg_gsb_frais_validerfraishorsforfais:
    path: /validerfraishorsforfait
    defaults:
        { _controller: PgGsbFraisBundle:SaisirFrais:validerfraishorsforfait }
    methods: [POST]
pg_gsb_frais_supprimerfraishorsforfait:
    # POST uniquement (correction du défaut B10) : une action destructrice ne
    # doit pas être déclenchable par un simple GET, qu'une balise <img> d'un
    # autre site suffirait à provoquer.
    path: /supprimerfraishorsforfait/{id}
    defaults:
        { _controller: PgGsbFraisBundle:SaisirFrais:supprimerfraishorsforfait }
    requirements: { id: '\d+' }
    methods: [POST]
pg_gsb_frais_monvehicule:
    path: /monvehicule
    defaults: { _controller: PgGsbFraisBundle:Vehicule:index }
pg_gsb_frais_validermonvehicule:
    path: /validermonvehicule
    defaults: { _controller: PgGsbFraisBundle:Vehicule:valider }
    methods: [POST]
pg_gsb_frais_joindrejustificatif:
    path: /joindrejustificatif/{id}
    defaults: { _controller: PgGsbFraisBundle:Justificatif:joindre }
    requirements: { id: '\d+' }
    methods: [POST]
pg_gsb_frais_consulterjustificatif:
    path: /justificatif/{id}
    defaults: { _controller: PgGsbFraisBundle:Justificatif:consulter }
    requirements: { id: '\d+' }
pg_gsb_frais_fichepdf:
    path: /fichepdf/{idVisiteur}/{mois}
    defaults: { _controller: PgGsbFraisBundle:FichePdf:imprimer }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}' }
pg_gsb_frais_fichespdfmois:
    # mois facultatif : sans argument, le contrôleur prend le mois précédent,
    # ce qui est exactement le besoin du cahier des charges. Cela évite de
    # devoir fournir la valeur à tous les gabarits qui affichent le menu.
    path: /fichespdf/{mois}
    defaults:
        { _controller: PgGsbFraisBundle:FichePdf:imprimerMois, mois: null }
    requirements: { mois: '\d{6}' }
pg_gsb_frais_validation:
    path: /validation
    defaults: { _controller: PgGsbFraisBundle:Validation:index }
pg_gsb_frais_validationrecap:
    path: /validation/recap
    defaults: { _controller: PgGsbFraisBundle:Validation:recap }
pg_gsb_frais_validationfiche:
    path: /validation/{idVisiteur}/{mois}
    defaults: { _controller: PgGsbFraisBundle:Validation:fiche }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}' }
pg_gsb_frais_validationcorriger:
    path: /validation/{idVisiteur}/{mois}/corriger
    defaults: { _controller: PgGsbFraisBundle:Validation:corriger }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}' }
    methods: [POST]
pg_gsb_frais_validationrefuser:
    path: /validation/{idVisiteur}/{mois}/refuser/{id}
    defaults: { _controller: PgGsbFraisBundle:Validation:refuser }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}', id: '\d+' }
    methods: [POST]
pg_gsb_frais_validationvalider:
    path: /validation/{idVisiteur}/{mois}/valider
    defaults: { _controller: PgGsbFraisBundle:Validation:valider }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}' }
    methods: [POST]
