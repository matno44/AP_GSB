pg_gsb_frais_accueil:
    path: /
    defaults:
        _controller: FrameworkBundle:Redirect:redirect
        route: pg_gsb_frais_home
        permanent: false

pg_gsb_frais_home:
    path: /accueil
    defaults: { _controller: PgGsbFraisBundle:Home:index }
pg_gsb_frais_validerconnexion:
    path: /validerconnexion
    defaults: { _controller: PgGsbFraisBundle:Home:validerconnexion }
    methods: [POST]
pg_gsb_frais_deconnexion:
    path: /deconnexion
    defaults: { _controller: PgGsbFraisBundle:Home:deconnexion }
pg_gsb_frais_listefrais:
    path: /listefrais
    defaults: { _controller: PgGsbFraisBundle:ListeFrais:index }
pg_gsb_frais_saisirfrais:
    path: /saisirfrais
    defaults: { _controller: PgGsbFraisBundle:SaisirFrais:index }
pg_gsb_frais_validerfraishorsforfais:
    path: /validerfraishorsforfait
    defaults:
        { _controller: PgGsbFraisBundle:SaisirFrais:validerfraishorsforfait }
    methods: [POST]
pg_gsb_frais_supprimerfraishorsforfait:
    # POST uniquement (correction du défaut B10) : une action destructrice ne
    # doit pas être déclenchable par un simple GET, qu'une balise <img> d'un
    # autre site suffirait à provoquer.
    path: /supprimerfraishorsforfait/{id}
    defaults:
        { _controller: PgGsbFraisBundle:SaisirFrais:supprimerfraishorsforfait }
    requirements: { id: '\d+' }
    methods: [POST]
pg_gsb_frais_monvehicule:
    path: /monvehicule
    defaults: { _controller: PgGsbFraisBundle:Vehicule:index }
pg_gsb_frais_validermonvehicule:
    path: /validermonvehicule
    defaults: { _controller: PgGsbFraisBundle:Vehicule:valider }
    methods: [POST]
pg_gsb_frais_joindrejustificatif:
    path: /joindrejustificatif/{id}
    defaults: { _controller: PgGsbFraisBundle:Justificatif:joindre }
    requirements: { id: '\d+' }
    methods: [POST]
pg_gsb_frais_consulterjustificatif:
    path: /justificatif/{id}
    defaults: { _controller: PgGsbFraisBundle:Justificatif:consulter }
    requirements: { id: '\d+' }
pg_gsb_frais_fichepdf:
    path: /fichepdf/{idVisiteur}/{mois}
    defaults: { _controller: PgGsbFraisBundle:FichePdf:imprimer }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}' }
pg_gsb_frais_fichespdfmois:
    # mois facultatif : sans argument, le contrôleur prend le mois précédent,
    # ce qui est exactement le besoin du cahier des charges. Cela évite de
    # devoir fournir la valeur à tous les gabarits qui affichent le menu.
    path: /fichespdf/{mois}
    defaults:
        { _controller: PgGsbFraisBundle:FichePdf:imprimerMois, mois: null }
    requirements: { mois: '\d{6}' }
pg_gsb_frais_validation:
    path: /validation
    defaults: { _controller: PgGsbFraisBundle:Validation:index }
pg_gsb_frais_validationrecap:
    path: /validation/recap
    defaults: { _controller: PgGsbFraisBundle:Validation:recap }
pg_gsb_frais_validationfiche:
    path: /validation/{idVisiteur}/{mois}
    defaults: { _controller: PgGsbFraisBundle:Validation:fiche }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}' }
pg_gsb_frais_validationcorriger:
    path: /validation/{idVisiteur}/{mois}/corriger
    defaults: { _controller: PgGsbFraisBundle:Validation:corriger }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}' }
    methods: [POST]
pg_gsb_frais_validationrefuser:
    path: /validation/{idVisiteur}/{mois}/refuser/{id}
    defaults: { _controller: PgGsbFraisBundle:Validation:refuser }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}', id: '\d+' }
    methods: [POST]
pg_gsb_frais_validationvalider:
    path: /validation/{idVisiteur}/{mois}/valider
    defaults: { _controller: PgGsbFraisBundle:Validation:valider }
    requirements: { idVisiteur: "[A-Za-z0-9]{1,4}", mois: '\d{6}' }
    methods: [POST]

# ---------------------------------------------------------------------------
# Phase 8 (hors cahier des charges) : administration des comptes
#
# Toutes les routes /admin/ sont contrôlées côté serveur par
# AdminController::refuserSiPasAdministrateur(). Le préfixe commun ne protège
# rien par lui-même : c'est une convention de lecture, pas un pare-feu.
#
# Les actions d'écriture sont en POST uniquement : une action qui modifie l'état
# ne doit pas être déclenchable par un GET, qu'une balise <img> d'un autre site
# suffirait à provoquer.
# ---------------------------------------------------------------------------
pg_gsb_frais_admin:
    path: /admin/comptes
    defaults: { _controller: PgGsbFraisBundle:Admin:index }
pg_gsb_frais_admincreer:
    path: /admin/comptes/creer
    defaults: { _controller: PgGsbFraisBundle:Admin:creer }
    # [GET] obligatoire : sans lui cette route capturerait aussi le POST de
    # pg_gsb_frais_adminenregistrercreation, déclarée après elle sur le même
    # chemin, et le formulaire se réafficherait au lieu d'être enregistré.
    methods: [GET]
pg_gsb_frais_adminenregistrercreation:
    path: /admin/comptes/creer
    defaults: { _controller: PgGsbFraisBundle:Admin:enregistrerCreation }
    methods: [POST]
pg_gsb_frais_adminjournal:
    path: /admin/journal
    defaults: { _controller: PgGsbFraisBundle:Admin:journal }
# Les routes paramétrées viennent APRÈS /admin/comptes/creer et /admin/journal :
# sans cela « creer » serait capturé comme un {role}, et « journal » comme un
# matricule. Le routeur retient la première route qui correspond.
pg_gsb_frais_adminmodifier:
    path: /admin/comptes/{role}/{id}/modifier
    defaults: { _controller: PgGsbFraisBundle:Admin:modifier }
    requirements: { role: 'visiteur|comptable|administrateur', id: '[A-Za-z0-9]{1,4}' }
    methods: [GET]
pg_gsb_frais_adminenregistrermodification:
    path: /admin/comptes/{role}/{id}/modifier
    defaults: { _controller: PgGsbFraisBundle:Admin:enregistrerModification }
    requirements: { role: 'visiteur|comptable|administrateur', id: '[A-Za-z0-9]{1,4}' }
    methods: [POST]
pg_gsb_frais_adminconfirmer:
    path: /admin/comptes/{role}/{id}/confirmer/{action}
    defaults: { _controller: PgGsbFraisBundle:Admin:confirmer }
    requirements:
        role: 'visiteur|comptable|administrateur'
        id: '[A-Za-z0-9]{1,4}'
        action: 'desactiver|reactiver|supprimer'
pg_gsb_frais_adminbasculer:
    path: /admin/comptes/{role}/{id}/basculer
    defaults: { _controller: PgGsbFraisBundle:Admin:basculerActif }
    requirements: { role: 'visiteur|comptable|administrateur', id: '[A-Za-z0-9]{1,4}' }
    methods: [POST]
pg_gsb_frais_adminsupprimer:
    path: /admin/comptes/{role}/{id}/supprimer
    defaults: { _controller: PgGsbFraisBundle:Admin:supprimer }
    requirements: { role: 'visiteur|comptable|administrateur', id: '[A-Za-z0-9]{1,4}' }
    methods: [POST]
pg_gsb_frais_adminreinitialiser:
    path: /admin/comptes/{role}/{id}/reinitialiser
    defaults: { _controller: PgGsbFraisBundle:Admin:reinitialiser }
    requirements: { role: 'visiteur|comptable|administrateur', id: '[A-Za-z0-9]{1,4}' }
    methods: [POST]

# Changement de mot de passe imposé. Hors préfixe /admin/ : il concerne les
# trois rôles, pas seulement les administrateurs.
pg_gsb_frais_changermotdepasse:
    path: /changermotdepasse
    defaults: { _controller: PgGsbFraisBundle:MotDePasse:formulaire }
    methods: [GET]
pg_gsb_frais_validerchangementmotdepasse:
    path: /changermotdepasse
    defaults: { _controller: PgGsbFraisBundle:MotDePasse:valider }
    methods: [POST]

# ---------------------------------------------------------------------------
# Phase 9 : détail des trajets
#
# Deux actions d'écriture, donc POST uniquement et jeton anti-CSRF. Elles
# n'ont pas de vue : elles redirigent vers l'écran de saisie, où les trajets
# s'affichent.
# ---------------------------------------------------------------------------
pg_gsb_frais_ajoutertrajet:
    path: /ajoutertrajet
    defaults: { _controller: PgGsbFraisBundle:Trajet:ajouter }
    methods: [POST]
pg_gsb_frais_supprimertrajet:
    path: /supprimertrajet/{id}
    defaults: { _controller: PgGsbFraisBundle:Trajet:supprimer }
    requirements: { id: '\d+' }
    methods: [POST]
