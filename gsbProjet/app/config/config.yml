imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: en

framework:
    #esi: ~
    #translator: { fallbacks: ['%locale%'] }
    secret: '%secret%'
    router:
        resource: '%kernel.root_dir%/config/routing.yml'
        strict_requirements: ~
    form: ~
    csrf_protection: ~
    validation: { enable_annotations: true }
    #serializer: { enable_annotations: true }
    templating:
        engines: ['twig']
    default_locale: '%locale%'
    trusted_hosts: ~
    trusted_proxies: ~
    session:
        # handler_id set to null will use default session handler from php.ini
        handler_id: ~
        # Refuse d'adopter un identifiant de session qui n'a pas été émis par
        # le serveur. Sans cela, n'importe qui peut IMPOSER un identifiant au
        # navigateur d'une victime (par une URL, un sous-domaine, du script) ;
        # PHP l'accepte tel quel et l'attaquant connaît alors la session.
        # C'est la barrière amont contre la fixation de session ; la barrière
        # aval est la régénération à la connexion (fct.inc.php).
        use_strict_mode: true
        # Le cookie de session n'est pas lisible par JavaScript : une faille
        # XSS ne permet plus de le voler. Valeur par défaut de Symfony, écrite
        # ici explicitement parce que php.ini du poste ne la fixe pas.
        cookie_httponly: true
    fragments: ~
    http_method_override: true

# Twig Configuration
twig:
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'

# Doctrine Configuration
doctrine:
    dbal:
        driver: pdo_mysql
        host: '%database_host%'
        port: '%database_port%'
        dbname: '%database_name%'
        user: '%database_user%'
        password: '%database_password%'
        charset: UTF8
        # if using pdo_sqlite as your database driver:
        #   1. add the path in parameters.yml
        #     e.g. database_path: '%kernel.root_dir%/data/data.db3'
        #   2. Uncomment database_path in parameters.yml.dist
        #   3. Uncomment next line:
        #path: '%database_path%'

    # ORM désactivée : l'application accède à la base uniquement via le
    # service pg_gsb_frais.pdo (PDO natif), aucune entité n'est mappée.
    # L'activer réintroduit doctrine/orm 2.5, incompatible PHP 7.3+
    # (« continue targeting switch » fatal dans UnitOfWork.php).
    #orm:
    #    auto_generate_proxy_classes: '%kernel.debug%'
    #    naming_strategy: doctrine.orm.naming_strategy.underscore
    #    auto_mapping: true

# Swiftmailer Configuration
swiftmailer:
    transport: '%mailer_transport%'
    host: '%mailer_host%'
    username: '%mailer_user%'
    password: '%mailer_password%'
    spool: { type: memory }
